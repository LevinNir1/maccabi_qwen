# One-command run:  docker compose up --build
# Switch model:     MODEL=qwen3.5:9b-q8_0 docker compose up --build
services:
  coder:
    build:
      context: .                                      # build from the Dockerfile in this folder
      args:
        MODEL: ${MODEL:-qwen3:4b-instruct-2507-q8_0}  # model to bake in; defaults to Qwen3-4B
    ports:
      - "8000:8000"                                   # expose the API on http://localhost:8000
